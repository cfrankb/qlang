# Native CI matrix: g++, clang++, mingw-w64 cross.
#
# All jobs run on ubuntu-latest. gxx and clang build every CMake target and
# run the full ctest suite (28 entries: 13 unit + 15 script). The mingw job
# cross-compiles to Windows PE binaries, which cannot run on a Linux runner,
# so it is build-only.
#
# Trigger: push to `main` only (placeholder — the repo branch is renamed from
# `master` before CI goes live; no PR, tag, or other-branch triggers by design).
name: CI (native)

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gxx:
    name: g++ (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Run tests (ctest)
        # Includes the `perf` baseline gate (tests/perf/perf_bench vs
        # tests/perf/baseline.json, ±20% / 0.5 ms per stage). The gate is
        # calibrated for g++/Linux Release, so it only runs in this job.
        run: ctest --test-dir build --output-on-failure

      - name: Upload perf result (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-result
          path: build/perf_result.json
          if-no-files-found: warn

  clang:
    name: clang++ (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure (CMake, Release, clang++)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Run tests (ctest)
        # The perf baseline gate is calibrated against the g++/Linux Release
        # baseline; exclude it here because clang++ timings would only add
        # cross-compiler noise (the gate runs in the gxx job).
        run: ctest --test-dir build -E perf --output-on-failure

  mingw:
    name: mingw-w64 cross g++ (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Configure (CMake, MinGW Makefiles)
        run: >
          cmake -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

      - name: "Build all targets (build-only, .exe cannot run on Linux)"
        run: cmake --build build --parallel
