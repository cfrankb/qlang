# MSVC portability gate.
#
# Builds every target in the root CMakeLists.txt with the most recent MSVC
# hosted on GitHub (VS 2022, windows-latest) and runs the full ctest suite.
# The "Show compiler version" step records the exact
# "C/C++ Optimizing Compiler Version" so the matrix in
# docs/COMPILER_PORTABILITY.md stays exact.
#
# Trigger: push to `main` only (placeholder — the repo branch is renamed from
# `master` before CI goes live; no PR, tag, or other-branch triggers by design).
name: CI (MSVC)

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vs:
    name: MSVC x64 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler version
        shell: pwsh
        run: |
          cmake --version
          # windows-latest does not put MSVC tools on PATH by default; import
          # the vcvars64 environment into this pwsh session so `cl` resolves.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          $vcvars = if ($vsPath) { Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat' } else { "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" }
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found (looked for: $vcvars)" }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }
          $line = (cl /? 2>&1 | Select-String 'Optimizing Compiler Version').ToString()
          if (-not $line) { throw "Could not find 'Optimizing Compiler Version' in `cl /?` output" }
          Write-Host $line
          $ver = [regex]::Match($line, 'Version ([\d.]+)').Groups[1].Value
          "msvc_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure (CMake, x64, Release)
        shell: pwsh
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build all CMakeLists.txt targets
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests (ctest)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
